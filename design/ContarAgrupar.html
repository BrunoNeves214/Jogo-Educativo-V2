<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>16. Contar e agrupar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; }
    .back-btn:hover { filter: brightness(0.96); }
    @keyframes basket-pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(107,191,89,0.5); } 50% { box-shadow: 0 0 0 16px rgba(107,191,89,0); } }
    @keyframes float-up { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-30px); opacity: 0; } }
    .basket { animation: basket-pulse 1.7s ease-in-out infinite; }
    .plus-one { animation: float-up 1.6s ease-out infinite; }
  </style>
<style>
  html, body { margin: 0; padding: 0; background: #EDEBF5; display:flex; align-items:center; justify-content:center; min-height:100vh; }
</style>
</head>
<body>
<div style="width:1024px;height:768px;box-sizing:border-box;position:relative;overflow:hidden;background:#F5FBF2;font-family:'Nunito',sans-serif;color:#2B2A4A;display:flex;flex-direction:column;">

  <div style="display:flex;align-items:center;justify-content:space-between;padding:20px 32px;">
    <a href="Main.html" class="back-btn" aria-label="Voltar ao in&iacute;cio" style="width:44px;height:44px;border-radius:50%;background:#FFFFFF;box-shadow:0 6px 14px rgba(43,42,74,0.10);display:flex;align-items:center;justify-content:center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6BBF59" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div style="background:#FFFFFF;border-radius:999px;padding:10px 26px;box-shadow:0 8px 16px rgba(43,42,74,0.12);">
      <span style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:19px;">Junta 5 estrelas &#9733;</span>
    </div>
    <div style="width:44px;height:44px;"></div>
  </div>

  <div style="flex-grow:1;position:relative;">

    <!-- scattered stars not yet grouped -->
    <svg width="50" height="50" viewBox="0 0 24 24" fill="#FFC145" style="position:absolute;top:70px;left:100px;" aria-hidden="true"><path d="M12 2l3 6 6.5.9-4.7 4.6 1.1 6.5L12 17l-5.9 3 1.1-6.5L2.5 8.9 9 8Z"/></svg>
    <svg width="46" height="46" viewBox="0 0 24 24" fill="#FFC145" style="position:absolute;top:150px;left:820px;" aria-hidden="true"><path d="M12 2l3 6 6.5.9-4.7 4.6 1.1 6.5L12 17l-5.9 3 1.1-6.5L2.5 8.9 9 8Z"/></svg>

    <!-- star mid-drag -->
    <svg width="52" height="52" viewBox="0 0 24 24" fill="#FFC145" style="position:absolute;top:280px;left:640px;filter:drop-shadow(0 10px 12px rgba(43,42,74,0.3));" aria-hidden="true"><path d="M12 2l3 6 6.5.9-4.7 4.6 1.1 6.5L12 17l-5.9 3 1.1-6.5L2.5 8.9 9 8Z"/></svg>
    <div class="plus-one" style="position:absolute;top:250px;left:660px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:22px;color:#6BBF59;">+1</div>

    <!-- basket -->
    <div class="basket" style="position:absolute;bottom:60px;left:50%;transform:translateX(-50%);width:280px;height:200px;border-radius:0 0 140px 140px;border:6px dashed #6BBF59;background:#EAF6E4;display:flex;align-items:flex-end;justify-content:center;gap:14px;padding-bottom:24px;">
      <svg width="52" height="52" viewBox="0 0 24 24" fill="#FFC145" aria-hidden="true"><path d="M12 2l3 6 6.5.9-4.7 4.6 1.1 6.5L12 17l-5.9 3 1.1-6.5L2.5 8.9 9 8Z"/></svg>
      <svg width="52" height="52" viewBox="0 0 24 24" fill="#FFC145" aria-hidden="true"><path d="M12 2l3 6 6.5.9-4.7 4.6 1.1 6.5L12 17l-5.9 3 1.1-6.5L2.5 8.9 9 8Z"/></svg>
      <svg width="52" height="52" viewBox="0 0 24 24" fill="#FFC145" aria-hidden="true"><path d="M12 2l3 6 6.5.9-4.7 4.6 1.1 6.5L12 17l-5.9 3 1.1-6.5L2.5 8.9 9 8Z"/></svg>
    </div>
    <div style="position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-family:'Baloo 2',sans-serif;font-weight:800;font-size:20px;color:#4E9A47;">3 / 5</div>
  </div>
</div>
</body>
</html>
