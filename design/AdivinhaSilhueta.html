<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10. Adivinha pela silhueta</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; }
    .back-btn:hover { filter: brightness(0.96); }
    @keyframes reveal-wipe {
      0%, 20% { clip-path: inset(0 100% 0 0); }
      65%, 100% { clip-path: inset(0 0% 0 0); }
    }
    .reveal-layer { animation: reveal-wipe 3.2s ease-in-out infinite alternate; }
  </style>
<style>
  html, body { margin: 0; padding: 0; background: #EDEBF5; display:flex; align-items:center; justify-content:center; min-height:100vh; }
</style>
</head>
<body>
<div style="width:1024px;height:768px;box-sizing:border-box;position:relative;overflow:hidden;background:#FFFBEF;font-family:'Nunito',sans-serif;color:#2B2A4A;display:flex;flex-direction:column;">

  <div style="display:flex;align-items:center;justify-content:space-between;padding:20px 32px;">
    <a href="Main.html" class="back-btn" aria-label="Voltar ao in&iacute;cio" style="width:44px;height:44px;border-radius:50%;background:#FFFFFF;box-shadow:0 6px 14px rgba(43,42,74,0.10);display:flex;align-items:center;justify-content:center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFB627" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:24px;">Adivinha pela Silhueta</div>
    <div style="width:44px;height:44px;"></div>
  </div>

  <div style="flex-grow:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;">

    <div style="width:300px;height:220px;background:#FFFFFF;border-radius:32px;box-shadow:0 10px 24px rgba(43,42,74,0.10);position:relative;overflow:hidden;">
      <svg width="300" height="220" viewBox="0 0 240 200" style="position:absolute;top:0;left:0;" aria-hidden="true">
        <g fill="#2B2A4A">
          <ellipse cx="100" cy="120" rx="70" ry="45"/>
          <circle cx="165" cy="90" r="38"/>
          <ellipse cx="145" cy="72" rx="24" ry="30"/>
          <path d="M198 92 Q220 106 210 138 Q204 150 193 143 Q202 120 190 100 Z"/>
          <rect x="55" y="150" width="18" height="40" rx="8"/>
          <rect x="88" y="155" width="18" height="38" rx="8"/>
          <rect x="122" y="155" width="18" height="38" rx="8"/>
          <rect x="150" y="150" width="18" height="40" rx="8"/>
        </g>
      </svg>
      <svg class="reveal-layer" width="300" height="220" viewBox="0 0 240 200" style="position:absolute;top:0;left:0;" aria-hidden="true">
        <g fill="#8E7DBE">
          <ellipse cx="100" cy="120" rx="70" ry="45"/>
          <circle cx="165" cy="90" r="38"/>
          <ellipse cx="145" cy="72" rx="24" ry="30" fill="#7A67AE"/>
          <path d="M198 92 Q220 106 210 138 Q204 150 193 143 Q202 120 190 100 Z"/>
          <rect x="55" y="150" width="18" height="40" rx="8"/>
          <rect x="88" y="155" width="18" height="38" rx="8"/>
          <rect x="122" y="155" width="18" height="38" rx="8"/>
          <rect x="150" y="150" width="18" height="40" rx="8"/>
          <circle cx="178" cy="82" r="3" fill="#2B2A4A"/>
        </g>
      </svg>
    </div>

    <div style="display:flex;gap:26px;">
      <div style="width:130px;height:130px;border-radius:28px;background:#FFFFFF;box-shadow:0 8px 18px rgba(43,42,74,0.10);display:flex;align-items:center;justify-content:center;">
        <svg width="70" height="70" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="13" rx="7.5" ry="6.4" fill="#4EA8DE"/><path d="M19 12l4.2-1.6-1 3.2Z" fill="#4E9DC2"/></svg>
      </div>
      <div style="position:relative;width:130px;height:130px;border-radius:28px;background:#FFFFFF;box-shadow:0 10px 26px rgba(63,182,95,0.35);border:4px solid #3FB65F;display:flex;align-items:center;justify-content:center;">
        <svg width="76" height="76" viewBox="0 0 240 200" aria-hidden="true">
          <g fill="#8E7DBE" transform="scale(0.32) translate(-5,-5)">
            <ellipse cx="100" cy="120" rx="70" ry="45"/>
            <circle cx="165" cy="90" r="38"/>
            <ellipse cx="145" cy="72" rx="24" ry="30" fill="#7A67AE"/>
          </g>
        </svg>
        <div style="position:absolute;top:-12px;right:-12px;width:32px;height:32px;border-radius:50%;background:#3FB65F;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(43,42,74,0.2);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13l4 4 10-10"/></svg>
        </div>
      </div>
      <div style="width:130px;height:130px;border-radius:28px;background:#FFFFFF;box-shadow:0 8px 18px rgba(43,42,74,0.10);display:flex;align-items:center;justify-content:center;">
        <svg width="70" height="70" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="15.5" rx="6.4" ry="5.2" fill="#F4A261"/><rect x="8" y="4" width="3.2" height="11" rx="1.6" fill="#F4A261"/><rect x="12.8" y="4" width="3.2" height="11" rx="1.6" fill="#F4A261"/></svg>
      </div>
    </div>
  </div>
</div>
</body>
</html>
