<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>24. Instrumentos no ecrã</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; }
    .back-btn:hover { filter: brightness(0.96); }
    @keyframes drum-hit { 0%,100% { transform: scale(1) rotate(0deg); } 25% { transform: scale(0.92) rotate(-3deg); } 50% { transform: scale(1.1) rotate(2deg); } 75% { transform: scale(0.97); } }
    @keyframes wave-ring { 0% { transform: scale(0.8); opacity: .6; } 100% { transform: scale(1.8); opacity: 0; } }
    @keyframes note-float { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(-70px) rotate(20deg); opacity: 0; } }
    .active-instrument { animation: drum-hit 1.1s ease-in-out infinite; }
    .wave { position:absolute; inset:-16px; border-radius:32px; border:3px solid #B892FF; animation: wave-ring 1.4s ease-out infinite; }
    .wave2 { animation-delay: .5s; }
    .note { animation: note-float 1.8s ease-out infinite; }
  </style>
<style>
  html, body { margin: 0; padding: 0; background: #EDEBF5; display:flex; align-items:center; justify-content:center; min-height:100vh; }
</style>
</head>
<body>
<div style="width:1024px;height:768px;box-sizing:border-box;position:relative;overflow:hidden;background:#FAF7FF;font-family:'Nunito',sans-serif;color:#2B2A4A;display:flex;flex-direction:column;">

  <div style="display:flex;align-items:center;justify-content:space-between;padding:20px 32px;">
    <a href="Main.html" class="back-btn" aria-label="Voltar ao in&iacute;cio" style="width:44px;height:44px;border-radius:50%;background:#FFFFFF;box-shadow:0 6px 14px rgba(43,42,74,0.10);display:flex;align-items:center;justify-content:center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B892FF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:24px;">Instrumentos no Ecr&atilde;</div>
    <div style="width:44px;height:44px;"></div>
  </div>

  <div style="flex-grow:1;display:flex;align-items:center;justify-content:center;gap:44px;">

    <div class="active-instrument" style="position:relative;width:190px;height:190px;border-radius:36px;background:#FFFFFF;box-shadow:0 14px 26px rgba(184,146,255,0.35);display:flex;align-items:center;justify-content:center;">
      <div class="wave"></div><div class="wave wave2"></div>
      <svg class="note" width="24" height="24" viewBox="0 0 24 24" fill="#B892FF" style="position:absolute;top:10px;right:20px;" aria-hidden="true"><path d="M9 17a3 3 0 1 1-2-2.83V4.5a1 1 0 0 1 1.2-.98l8 1.6A1 1 0 0 1 17 6.1v8.4a3 3 0 1 1-2-2.83V8.1l-6-1.2Z"/></svg>
      <svg width="96" height="96" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="8" ry="3" fill="#FF6F59"/><path d="M4 6v10a8 3 0 0 0 16 0V6" fill="#FFC145" stroke="#FF6F59" stroke-width="1"/><ellipse cx="12" cy="16" rx="8" ry="3" fill="#FF6F59"/></svg>
    </div>

    <div style="width:190px;height:190px;border-radius:36px;background:#FFFFFF;box-shadow:0 8px 18px rgba(43,42,74,0.10);display:flex;align-items:center;justify-content:center;gap:6px;padding:0 20px;">
      <div style="width:16px;height:110px;border-radius:8px;background:#FF6F59;"></div>
      <div style="width:16px;height:90px;border-radius:8px;background:#FFC145;"></div>
      <div style="width:16px;height:70px;border-radius:8px;background:#6BBF59;"></div>
      <div style="width:16px;height:50px;border-radius:8px;background:#4EA8DE;"></div>
    </div>

    <div style="width:190px;height:190px;border-radius:36px;background:#FFFFFF;box-shadow:0 8px 18px rgba(43,42,74,0.10);display:flex;align-items:center;justify-content:center;">
      <svg width="90" height="90" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0-6 6v3l-2 5h16l-2-5V9a6 6 0 0 0-6-6Z" fill="#FFC145"/><circle cx="12" cy="20" r="1.6" fill="#F2A800"/></svg>
    </div>

    <div style="width:190px;height:190px;border-radius:36px;background:#FFFFFF;box-shadow:0 8px 18px rgba(43,42,74,0.10);display:flex;align-items:center;justify-content:center;gap:14px;">
      <svg width="46" height="80" viewBox="0 0 24 40" aria-hidden="true"><circle cx="12" cy="10" r="9" fill="#FF8FB1"/><rect x="9" y="18" width="6" height="20" rx="3" fill="#8B5E34"/></svg>
      <svg width="46" height="80" viewBox="0 0 24 40" aria-hidden="true"><circle cx="12" cy="10" r="9" fill="#4EA8DE"/><rect x="9" y="18" width="6" height="20" rx="3" fill="#8B5E34"/></svg>
    </div>
  </div>
</div>
</body>
</html>
