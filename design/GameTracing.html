<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2. Traçar a letra</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; }
    .back-btn:hover { filter: brightness(0.96); }
    .action-btn:hover { filter: brightness(1.06); }
  </style>
<style>
  html, body { margin: 0; padding: 0; background: #EDEBF5; display:flex; align-items:center; justify-content:center; min-height:100vh; }
</style>
</head>
<body>
<div style="width:1024px;height:768px;box-sizing:border-box;position:relative;overflow:hidden;background:#FFF3EF;font-family:'Nunito',sans-serif;color:#2B2A4A;display:flex;flex-direction:column;">

  <!-- top bar -->
  <div style="display:flex;align-items:center;justify-content:space-between;padding:20px 32px;">
    <a href="Category.html" class="back-btn" aria-label="Voltar &agrave; categoria" style="width:44px;height:44px;border-radius:50%;background:#FFFFFF;box-shadow:0 6px 14px rgba(43,42,74,0.10);display:flex;align-items:center;justify-content:center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FF6F59" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:24px;">Desenha a Letra</div>
    <div style="width:44px;height:44px;"></div>
  </div>

  <!-- content -->
  <div style="flex-grow:1;display:flex;align-items:center;justify-content:center;gap:56px;padding:0 40px 24px 40px;">

    <!-- tracing canvas -->
    <div style="width:420px;height:420px;background:#FFFFFF;border-radius:36px;box-shadow:0 10px 24px rgba(43,42,74,0.10);display:flex;align-items:center;justify-content:center;position:relative;">
      <svg width="300" height="300" viewBox="0 0 300 300" aria-hidden="true">
        <path d="M70 260 L150 40 L230 260" fill="none" stroke="#E4C9C3" stroke-width="15" stroke-linecap="round" stroke-dasharray="2 20"/>
        <path d="M100 175 L200 175" fill="none" stroke="#E4C9C3" stroke-width="15" stroke-linecap="round" stroke-dasharray="2 20"/>
        <path d="M70 260 L150 40 L230 260" fill="none" stroke="#2EC4B6" stroke-width="16" stroke-linecap="round" pathLength="100" stroke-dasharray="58 100"/>
        <circle cx="184" cy="150" r="13" fill="#2EC4B6" stroke="#FFFFFF" stroke-width="4"/>
      </svg>
      <div style="position:absolute;bottom:20px;left:0;right:0;text-align:center;font-family:'Nunito',sans-serif;font-weight:700;font-size:13px;color:#8A89A6;">Segue o pontilhado com o dedo</div>
    </div>

    <!-- sidebar -->
    <div style="display:flex;flex-direction:column;gap:18px;width:260px;">
      <div style="background:#FFFFFF;border-radius:24px;padding:20px;box-shadow:0 8px 18px rgba(43,42,74,0.10);text-align:center;">
        <div style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:56px;color:#FF6F59;">A</div>
        <div style="font-family:'Nunito',sans-serif;font-weight:700;font-size:14px;color:#6B6A8A;margin-top:2px;">&ldquo;&Aacute;&rdquo;</div>
      </div>
      <button type="button" class="action-btn" style="display:flex;align-items:center;justify-content:center;gap:10px;background:#FF6F59;color:#FFFFFF;border:none;border-radius:999px;padding:14px 18px;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:15px;box-shadow:0 8px 16px rgba(255,111,89,0.3);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M17 8.5a5 5 0 0 1 0 7"/></svg>
        Ouvir a letra
      </button>
      <button type="button" class="action-btn" style="display:flex;align-items:center;justify-content:center;gap:10px;background:#FFFFFF;color:#6B6A8A;border:none;border-radius:999px;padding:14px 18px;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:15px;box-shadow:0 6px 14px rgba(43,42,74,0.10);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6A8A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4v6h6"/><path d="M20 20v-6h-6"/><path d="M5.5 9a7 7 0 0 1 12-3.5L20 8"/><path d="M18.5 15a7 7 0 0 1-12 3.5L4 16"/></svg>
        Limpar tra&ccedil;o
      </button>
    </div>
  </div>
</div>
</body>
</html>
