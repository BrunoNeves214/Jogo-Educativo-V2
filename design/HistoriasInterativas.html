<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>15. Histórias interativas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; }
    .back-btn:hover { filter: brightness(0.96); }
    .choice-btn:hover { transform: translateY(-3px); }
    @keyframes drift { 0% { transform: translateX(0); } 100% { transform: translateX(40px); } }
    @keyframes idle-bob { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-8px) rotate(-2deg); } }
    .cloud-a { animation: drift 8s ease-in-out infinite alternate; }
    .cloud-b { animation: drift 10s ease-in-out infinite alternate-reverse; }
    .rabbit { animation: idle-bob 2.4s ease-in-out infinite; }
  </style>
<style>
  html, body { margin: 0; padding: 0; background: #EDEBF5; display:flex; align-items:center; justify-content:center; min-height:100vh; }
</style>
</head>
<body>
<div style="width:1024px;height:768px;box-sizing:border-box;position:relative;overflow:hidden;background:#DCEFFC;font-family:'Nunito',sans-serif;color:#2B2A4A;display:flex;flex-direction:column;">

  <div style="display:flex;align-items:center;justify-content:space-between;padding:20px 32px;position:relative;z-index:5;">
    <a href="Main.html" class="back-btn" aria-label="Voltar ao in&iacute;cio" style="width:44px;height:44px;border-radius:50%;background:#FFFFFF;box-shadow:0 6px 14px rgba(43,42,74,0.10);display:flex;align-items:center;justify-content:center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4EA8DE" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:24px;">Hist&oacute;rias Interativas</div>
    <div style="width:44px;height:44px;"></div>
  </div>

  <!-- scene -->
  <div style="flex-grow:1;position:relative;">
    <div class="cloud-a" style="position:absolute;top:40px;left:80px;width:110px;height:44px;background:#FFFFFF;opacity:.85;border-radius:30px;"></div>
    <div class="cloud-b" style="position:absolute;top:80px;right:140px;width:90px;height:38px;background:#FFFFFF;opacity:.75;border-radius:26px;"></div>

    <div style="position:absolute;bottom:0;left:0;right:0;height:200px;background:#B6E3A6;border-radius:60% 60% 0 0 / 40px 40px 0 0;"></div>

    <div style="position:absolute;bottom:130px;left:120px;width:18px;height:70px;background:#8B5E34;border-radius:4px;"></div>
    <div style="position:absolute;bottom:175px;left:75px;width:0;height:0;border-left:56px solid transparent;border-right:56px solid transparent;border-bottom:100px solid #57A566;"></div>

    <div style="position:absolute;bottom:150px;left:800px;width:16px;height:56px;background:#8B5E34;border-radius:4px;"></div>
    <div style="position:absolute;bottom:185px;left:762px;width:0;height:0;border-left:44px solid transparent;border-right:44px solid transparent;border-bottom:80px solid #4E9A5C;"></div>

    <svg class="rabbit" width="130" height="150" viewBox="0 0 24 24" style="position:absolute;bottom:170px;left:440px;" aria-hidden="true">
      <ellipse cx="12" cy="15.5" rx="6.4" ry="5.2" fill="#EDEDED"/>
      <rect x="8" y="4" width="3.2" height="11" rx="1.6" fill="#EDEDED"/>
      <rect x="12.8" y="4" width="3.2" height="11" rx="1.6" fill="#EDEDED"/>
      <rect x="8.7" y="6" width="1.4" height="7" rx="0.7" fill="#FF8FB1"/>
      <rect x="13.5" y="6" width="1.4" height="7" rx="0.7" fill="#FF8FB1"/>
      <circle cx="9.6" cy="15" r="1.1" fill="#2B2A4A"/>
      <circle cx="14.4" cy="15" r="1.1" fill="#2B2A4A"/>
    </svg>
  </div>

  <!-- narration + choices -->
  <div style="position:relative;z-index:5;">
    <div style="display:flex;justify-content:center;gap:20px;padding:0 40px 18px 40px;">
      <button type="button" class="choice-btn" style="display:flex;align-items:center;gap:10px;background:#FFFFFF;border:none;border-radius:20px;padding:14px 22px;box-shadow:0 8px 16px rgba(43,42,74,0.14);font-family:'Baloo 2',sans-serif;font-weight:700;font-size:16px;">
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 L14.5 9 H21 L15.5 13 L17.5 20 L12 16 L6.5 20 L8.5 13 L3 9 H9.5 Z" fill="#57A566"/></svg>
        Foi &agrave; floresta
      </button>
      <button type="button" class="choice-btn" style="display:flex;align-items:center;gap:10px;background:#FFFFFF;border:none;border-radius:20px;padding:14px 22px;box-shadow:0 8px 16px rgba(43,42,74,0.14);font-family:'Baloo 2',sans-serif;font-weight:700;font-size:16px;">
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11 L12 4 L20 11 V20 H14 V14 H10 V20 H4 Z" fill="#F4A261"/></svg>
        Voltou a casa
      </button>
    </div>
    <div style="background:#2B2A4A;color:#FFFFFF;padding:22px 40px 26px 40px;font-family:'Nunito',sans-serif;font-weight:700;font-size:17px;text-align:center;">
      O coelhinho encontrou uma cenoura enorme. O que fez a seguir?
    </div>
  </div>
</div>
</body>
</html>
