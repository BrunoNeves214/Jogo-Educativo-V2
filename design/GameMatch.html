<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>9. Memória de animais</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; }
    .back-btn:hover { filter: brightness(0.96); }
  </style>
<style>
  html, body { margin: 0; padding: 0; background: #EDEBF5; display:flex; align-items:center; justify-content:center; min-height:100vh; }
</style>
</head>
<body>
<div style="width:1024px;height:768px;box-sizing:border-box;position:relative;overflow:hidden;background:#FFFBEF;font-family:'Nunito',sans-serif;color:#2B2A4A;display:flex;flex-direction:column;">

  <!-- top bar -->
  <div style="display:flex;align-items:center;justify-content:space-between;padding:20px 32px;">
    <a href="Main.html" class="back-btn" aria-label="Voltar ao in&iacute;cio" style="width:44px;height:44px;border-radius:50%;background:#FFFFFF;box-shadow:0 6px 14px rgba(43,42,74,0.10);display:flex;align-items:center;justify-content:center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFB627" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:24px;">Mem&oacute;ria dos Animais</div>
    <div style="width:44px;height:44px;"></div>
  </div>

  <div style="flex-grow:1;display:flex;align-items:center;justify-content:center;gap:36px;padding-bottom:12px;">

    <!-- card grid -->
    <div style="display:grid;grid-template-columns:repeat(4, 110px);grid-template-rows:repeat(2, 110px);gap:18px;">

      <!-- matched pair: cat -->
      <div style="position:relative;width:110px;height:110px;border-radius:22px;background:#FFFFFF;border:4px solid #3FB65F;box-shadow:0 8px 16px rgba(63,182,95,0.25);display:flex;align-items:center;justify-content:center;">
        <svg width="52" height="52" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4l2.5 4h7L18 4l-1 5a6 6 0 0 1-10 0Z" fill="#F4A261"/><circle cx="9.3" cy="12.5" r="1" fill="#2B2A4A"/><circle cx="14.7" cy="12.5" r="1" fill="#2B2A4A"/><path d="M11 14.5h2" stroke="#2B2A4A" stroke-width="1.2" stroke-linecap="round"/></svg>
      </div>
      <!-- back -->
      <div style="width:110px;height:110px;border-radius:22px;background:#FFB627;box-shadow:0 6px 12px rgba(43,42,74,0.12);display:flex;align-items:center;justify-content:center;">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><ellipse cx="12" cy="16.5" rx="6" ry="4.6"/><ellipse cx="4.6" cy="9.4" rx="2.1" ry="2.9"/><ellipse cx="9.6" cy="5.6" rx="2.1" ry="2.9"/><ellipse cx="14.4" cy="5.6" rx="2.1" ry="2.9"/><ellipse cx="19.4" cy="9.4" rx="2.1" ry="2.9"/></svg>
      </div>
      <!-- flipped mismatch: dog -->
      <div style="width:110px;height:110px;border-radius:22px;background:#FFFFFF;box-shadow:0 8px 16px rgba(43,42,74,0.12);display:flex;align-items:center;justify-content:center;">
        <svg width="52" height="52" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6c-1.5 0-2.5 2-1.5 4l2 2" fill="none" stroke="#8B5E34" stroke-width="1.6" stroke-linecap="round"/><path d="M19 6c1.5 0 2.5 2 1.5 4l-2 2" fill="none" stroke="#8B5E34" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="12" r="6" fill="#C68B59"/><circle cx="9.5" cy="11.5" r="1" fill="#2B2A4A"/><circle cx="14.5" cy="11.5" r="1" fill="#2B2A4A"/><ellipse cx="12" cy="14" rx="1.3" ry="1" fill="#2B2A4A"/></svg>
      </div>
      <!-- back -->
      <div style="width:110px;height:110px;border-radius:22px;background:#FFB627;box-shadow:0 6px 12px rgba(43,42,74,0.12);display:flex;align-items:center;justify-content:center;">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><ellipse cx="12" cy="16.5" rx="6" ry="4.6"/><ellipse cx="4.6" cy="9.4" rx="2.1" ry="2.9"/><ellipse cx="9.6" cy="5.6" rx="2.1" ry="2.9"/><ellipse cx="14.4" cy="5.6" rx="2.1" ry="2.9"/><ellipse cx="19.4" cy="9.4" rx="2.1" ry="2.9"/></svg>
      </div>

      <!-- back -->
      <div style="width:110px;height:110px;border-radius:22px;background:#FFB627;box-shadow:0 6px 12px rgba(43,42,74,0.12);display:flex;align-items:center;justify-content:center;">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><ellipse cx="12" cy="16.5" rx="6" ry="4.6"/><ellipse cx="4.6" cy="9.4" rx="2.1" ry="2.9"/><ellipse cx="9.6" cy="5.6" rx="2.1" ry="2.9"/><ellipse cx="14.4" cy="5.6" rx="2.1" ry="2.9"/><ellipse cx="19.4" cy="9.4" rx="2.1" ry="2.9"/></svg>
      </div>
      <!-- matched pair: bird -->
      <div style="width:110px;height:110px;border-radius:22px;background:#FFFFFF;border:4px solid #3FB65F;box-shadow:0 8px 16px rgba(63,182,95,0.25);display:flex;align-items:center;justify-content:center;">
        <svg width="48" height="48" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="13" rx="7" ry="6" fill="#4EA8DE"/><path d="M18 12l4-1.5-1 3Z" fill="#F4A261"/><circle cx="9" cy="10.5" r="1" fill="#2B2A4A"/></svg>
      </div>
      <!-- back -->
      <div style="width:110px;height:110px;border-radius:22px;background:#FFB627;box-shadow:0 6px 12px rgba(43,42,74,0.12);display:flex;align-items:center;justify-content:center;">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><ellipse cx="12" cy="16.5" rx="6" ry="4.6"/><ellipse cx="4.6" cy="9.4" rx="2.1" ry="2.9"/><ellipse cx="9.6" cy="5.6" rx="2.1" ry="2.9"/><ellipse cx="14.4" cy="5.6" rx="2.1" ry="2.9"/><ellipse cx="19.4" cy="9.4" rx="2.1" ry="2.9"/></svg>
      </div>
      <!-- back -->
      <div style="width:110px;height:110px;border-radius:22px;background:#FFB627;box-shadow:0 6px 12px rgba(43,42,74,0.12);display:flex;align-items:center;justify-content:center;">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><ellipse cx="12" cy="16.5" rx="6" ry="4.6"/><ellipse cx="4.6" cy="9.4" rx="2.1" ry="2.9"/><ellipse cx="9.6" cy="5.6" rx="2.1" ry="2.9"/><ellipse cx="14.4" cy="5.6" rx="2.1" ry="2.9"/><ellipse cx="19.4" cy="9.4" rx="2.1" ry="2.9"/></svg>
      </div>
    </div>

    <!-- side hint card -->
    <div style="width:210px;background:#FFFFFF;border-radius:24px;padding:20px;box-shadow:0 8px 18px rgba(43,42,74,0.10);text-align:center;">
      <div style="font-family:'Baloo 2',sans-serif;font-weight:700;font-size:15px;color:#F4A261;">Quase!</div>
      <div style="font-family:'Nunito',sans-serif;font-weight:700;font-size:13px;color:#6B6A8A;margin-top:6px;">Tenta outra vez para encontrar o par</div>
      <div style="display:flex;justify-content:center;gap:2px;margin-top:14px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#FFC145" aria-hidden="true"><path d="M12 2l3 6 6.5.9-4.7 4.6 1.1 6.5L12 17l-5.9 3 1.1-6.5L2.5 8.9 9 8Z"/></svg>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#FFC145" aria-hidden="true"><path d="M12 2l3 6 6.5.9-4.7 4.6 1.1 6.5L12 17l-5.9 3 1.1-6.5L2.5 8.9 9 8Z"/></svg>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#E7E4F0" aria-hidden="true"><path d="M12 2l3 6 6.5.9-4.7 4.6 1.1 6.5L12 17l-5.9 3 1.1-6.5L2.5 8.9 9 8Z"/></svg>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#E7E4F0" aria-hidden="true"><path d="M12 2l3 6 6.5.9-4.7 4.6 1.1 6.5L12 17l-5.9 3 1.1-6.5L2.5 8.9 9 8Z"/></svg>
      </div>
    </div>
  </div>
</div>
</body>
</html>
