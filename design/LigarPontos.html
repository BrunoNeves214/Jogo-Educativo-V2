<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>20. Ligar pontos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; }
    .back-btn:hover { filter: brightness(0.96); }
    @keyframes dot-pulse { 0%,100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,143,177,0.6); } 50% { transform: scale(1.25); box-shadow: 0 0 0 14px rgba(255,143,177,0); } }
    @keyframes line-draw { from { stroke-dashoffset: 200; } to { stroke-dashoffset: 0; } }
    .active-dot { animation: dot-pulse 1.3s ease-in-out infinite; }
    .drawn-line { stroke-dasharray: 200; animation: line-draw 2.4s ease-in-out infinite; }
  </style>
<style>
  html, body { margin: 0; padding: 0; background: #EDEBF5; display:flex; align-items:center; justify-content:center; min-height:100vh; }
</style>
</head>
<body>
<div style="width:1024px;height:768px;box-sizing:border-box;position:relative;overflow:hidden;background:#FFF6F9;font-family:'Nunito',sans-serif;color:#2B2A4A;display:flex;flex-direction:column;">

  <div style="display:flex;align-items:center;justify-content:space-between;padding:20px 32px;">
    <a href="Main.html" class="back-btn" aria-label="Voltar ao in&iacute;cio" style="width:44px;height:44px;border-radius:50%;background:#FFFFFF;box-shadow:0 6px 14px rgba(43,42,74,0.10);display:flex;align-items:center;justify-content:center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FF8FB1" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:24px;">Ligar Pontos</div>
    <div style="width:44px;height:44px;"></div>
  </div>

  <div style="flex-grow:1;display:flex;align-items:center;justify-content:center;">
    <div style="width:400px;height:400px;background:#FFFFFF;border-radius:36px;box-shadow:0 10px 24px rgba(43,42,74,0.10);position:relative;">
      <svg width="400" height="400" viewBox="0 0 400 400" aria-hidden="true">
        <polygon points="200,60 340,150 340,250 200,340 60,250 60,150" fill="none" stroke="#F7D6E1" stroke-width="2" stroke-dasharray="3 8"/>
        <polyline class="drawn-line" points="200,60 340,150 340,250 200,340" fill="none" stroke="#FF8FB1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>

      <div style="position:absolute;top:44px;left:186px;width:28px;height:28px;border-radius:50%;background:#FF6F59;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:14px;">1</div>
      <div style="position:absolute;top:136px;left:326px;width:28px;height:28px;border-radius:50%;background:#FF6F59;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:14px;">2</div>
      <div style="position:absolute;top:236px;left:326px;width:28px;height:28px;border-radius:50%;background:#FF6F59;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:14px;">3</div>
      <div style="position:absolute;top:326px;left:186px;width:28px;height:28px;border-radius:50%;background:#FF6F59;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:14px;">4</div>
      <div class="active-dot" style="position:absolute;top:236px;left:46px;width:30px;height:30px;border-radius:50%;background:#FF8FB1;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:14px;">5</div>
      <div style="position:absolute;top:136px;left:46px;width:28px;height:28px;border-radius:50%;background:#F3D9E2;color:#B98098;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:14px;">6</div>
    </div>
  </div>
</div>
</body>
</html>
