<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>14. Associar imagem-palavra</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; }
    .back-btn:hover { filter: brightness(0.96); }
    @keyframes dash-flow { to { stroke-dashoffset: -40; } }
    @keyframes sun-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .flow-line { stroke-dasharray: 10 8; animation: dash-flow 1s linear infinite; }
    .sun-icon { animation: sun-spin 20s linear infinite; transform-origin: center; }
  </style>
<style>
  html, body { margin: 0; padding: 0; background: #EDEBF5; display:flex; align-items:center; justify-content:center; min-height:100vh; }
</style>
</head>
<body>
<div style="width:1024px;height:768px;box-sizing:border-box;position:relative;overflow:hidden;background:#F2FAFF;font-family:'Nunito',sans-serif;color:#2B2A4A;display:flex;flex-direction:column;">

  <div style="display:flex;align-items:center;justify-content:space-between;padding:20px 32px;">
    <a href="Main.html" class="back-btn" aria-label="Voltar ao in&iacute;cio" style="width:44px;height:44px;border-radius:50%;background:#FFFFFF;box-shadow:0 6px 14px rgba(43,42,74,0.10);display:flex;align-items:center;justify-content:center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4EA8DE" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:24px;">Associa a Imagem &agrave; Palavra</div>
    <div style="width:44px;height:44px;"></div>
  </div>

  <div style="flex-grow:1;position:relative;display:flex;align-items:center;justify-content:space-between;padding:20px 130px;">

    <!-- words column -->
    <div style="display:flex;flex-direction:column;gap:34px;z-index:2;">
      <div style="width:170px;padding:20px;text-align:center;background:#FFFFFF;border-radius:22px;box-shadow:0 10px 22px rgba(78,168,222,0.3);border:4px solid #4EA8DE;">
        <span style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:30px;letter-spacing:2px;">SOL</span>
      </div>
      <div style="width:170px;padding:20px;text-align:center;background:#FFFFFF;border-radius:22px;box-shadow:0 8px 18px rgba(43,42,74,0.10);">
        <span style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:30px;letter-spacing:2px;color:#6B6A8A;">LUA</span>
      </div>
      <div style="width:170px;padding:20px;text-align:center;background:#FFFFFF;border-radius:22px;box-shadow:0 8px 18px rgba(43,42,74,0.10);">
        <span style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:30px;letter-spacing:2px;color:#6B6A8A;">MAR</span>
      </div>
    </div>

    <!-- connecting line -->
    <svg width="440" height="380" viewBox="0 0 440 380" style="position:absolute;left:220px;top:60px;z-index:1;" aria-hidden="true">
      <path class="flow-line" d="M10 40 C 180 20, 260 20, 430 40" fill="none" stroke="#4EA8DE" stroke-width="4" stroke-linecap="round"/>
    </svg>

    <!-- images column -->
    <div style="display:flex;flex-direction:column;gap:34px;z-index:2;">
      <div style="width:110px;height:110px;border-radius:26px;background:#FFFFFF;box-shadow:0 10px 22px rgba(78,168,222,0.3);border:4px solid #4EA8DE;display:flex;align-items:center;justify-content:center;">
        <svg class="sun-icon" width="70" height="70" viewBox="0 0 90 90" aria-hidden="true">
          <g stroke="#FFD976" stroke-width="6" stroke-linecap="round"><line x1="45" y1="4" x2="45" y2="18"/><line x1="45" y1="72" x2="45" y2="86"/><line x1="4" y1="45" x2="18" y2="45"/><line x1="72" y1="45" x2="86" y2="45"/></g>
          <circle cx="45" cy="45" r="24" fill="#FFC145"/>
        </svg>
      </div>
      <div style="width:110px;height:110px;border-radius:26px;background:#FFFFFF;box-shadow:0 8px 18px rgba(43,42,74,0.10);display:flex;align-items:center;justify-content:center;">
        <svg width="60" height="60" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3a9 9 0 1 0 6 15 8 8 0 0 1-6-15Z" fill="#8E7DBE"/></svg>
      </div>
      <div style="width:110px;height:110px;border-radius:26px;background:#FFFFFF;box-shadow:0 8px 18px rgba(43,42,74,0.10);display:flex;align-items:center;justify-content:center;">
        <svg width="64" height="64" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 15c2 2 4 2 6 0s4-2 6 0 4 2 6 0 4-2 6 0" fill="none" stroke="#4EA8DE" stroke-width="2.4" stroke-linecap="round"/><path d="M2 19c2 2 4 2 6 0s4-2 6 0 4 2 6 0 4-2 6 0" fill="none" stroke="#4EA8DE" stroke-width="2.4" stroke-linecap="round" opacity=".5"/></svg>
      </div>
    </div>
  </div>
</div>
</body>
</html>
