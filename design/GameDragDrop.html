<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3. Puzzle do alfabeto</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; }
    .back-btn:hover { filter: brightness(0.96); }
    @keyframes glow-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255,111,89,0.45); }
      50% { box-shadow: 0 0 0 10px rgba(255,111,89,0); }
    }
    .target-slot { animation: glow-pulse 1.6s ease-in-out infinite; }
  </style>
<style>
  html, body { margin: 0; padding: 0; background: #EDEBF5; display:flex; align-items:center; justify-content:center; min-height:100vh; }
</style>
</head>
<body>
<div style="width:1024px;height:768px;box-sizing:border-box;position:relative;overflow:hidden;background:#FFF3EF;font-family:'Nunito',sans-serif;color:#2B2A4A;display:flex;flex-direction:column;">

  <!-- top bar -->
  <div style="display:flex;align-items:center;justify-content:space-between;padding:20px 32px;">
    <a href="Category.html" class="back-btn" aria-label="Voltar &agrave; categoria" style="width:44px;height:44px;border-radius:50%;background:#FFFFFF;box-shadow:0 6px 14px rgba(43,42,74,0.10);display:flex;align-items:center;justify-content:center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FF6F59" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:24px;">Puzzle do Alfabeto</div>
    <div style="width:44px;height:44px;"></div>
  </div>

  <div style="font-family:'Nunito',sans-serif;font-weight:700;font-size:14px;color:#6B6A8A;text-align:center;">Arrasta as pe&ccedil;as para o lugar certo</div>

  <!-- tray of loose pieces -->
  <div style="flex-grow:1;position:relative;padding:20px 60px;">
    <div style="display:flex;gap:80px;justify-content:center;padding-top:30px;">
      <div style="width:96px;height:96px;border-radius:22px;background:#FFC145;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 18px rgba(43,42,74,0.16);transform:rotate(-9deg);">
        <span style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:44px;color:#FFFFFF;">T</span>
      </div>
    </div>

    <!-- piece mid-drag -->
    <div style="position:absolute;top:118px;left:452px;width:96px;height:96px;border-radius:22px;background:#4EA8DE;display:flex;align-items:center;justify-content:center;box-shadow:0 20px 30px rgba(43,42,74,0.30);transform:rotate(-7deg);z-index:3;">
      <span style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:44px;color:#FFFFFF;">M</span>
    </div>

    <!-- landing bed of slots -->
    <div style="position:absolute;bottom:36px;left:60px;right:60px;display:flex;gap:24px;justify-content:center;background:#FFFFFF;border-radius:28px;padding:22px;box-shadow:0 8px 18px rgba(43,42,74,0.10);">

      <div style="width:96px;height:96px;border-radius:20px;background:#6BBF59;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 12px rgba(43,42,74,0.14);">
        <span style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:44px;color:#FFFFFF;">S</span>
      </div>
      <div style="width:96px;height:96px;border-radius:20px;background:#8E7DBE;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 12px rgba(43,42,74,0.14);">
        <span style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:44px;color:#FFFFFF;">O</span>
      </div>
      <div style="width:96px;height:96px;border-radius:20px;background:#FF6F59;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 12px rgba(43,42,74,0.14);">
        <span style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:44px;color:#FFFFFF;">L</span>
      </div>
      <div class="target-slot" style="width:96px;height:96px;border-radius:20px;background:#FDEDE9;border:4px dashed #FF6F59;display:flex;align-items:center;justify-content:center;">
        <span style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:44px;color:#F5C3B8;">M</span>
      </div>
      <div style="width:96px;height:96px;border-radius:20px;background:#F3F1FA;border:4px dashed #D9D6EA;display:flex;align-items:center;justify-content:center;">
        <span style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:44px;color:#D9D6EA;">T</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
