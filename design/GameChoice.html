<!doctype html>

  <style>
    body { margin: 0; }

    button { font-family: inherit; cursor: pointer; }
    .back-btn:hover { filter: brightness(0.96); }
    .repeat-pill:hover { filter: brightness(0.97); }
    @keyframes pulse-ring {
      0% { transform: scale(0.9); opacity: .55; }
      100% { transform: scale(1.35); opacity: 0; }
    }
    .ring { position:absolute; inset:0; border-radius:50%; border:3px solid #FF6F59; animation: pulse-ring 1.8s ease-out infinite; }
    .ring2 { animation-delay: .6s; }
  </style>

    <svg width="18" height="18" viewBox="0 0 24 24" fill="#FFC145" aria-hidden="true"><path d="M12 2l3 6 6.5.9-4.7 4.6 1.1 6.5L12 17l-5.9 3 1.1-6.5L2.5 8.9 9 8Z"/></svg>

    <svg width="18" height="18" viewBox="0 0 24 24" fill="#FFC145" aria-hidden="true"><path d="M12 2l3 6 6.5.9-4.7 4.6 1.1 6.5L12 17l-5.9 3 1.1-6.5L2.5 8.9 9 8Z"/></svg>
