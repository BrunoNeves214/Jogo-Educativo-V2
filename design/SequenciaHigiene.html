<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>22. Sequência de higiene</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; }
    .back-btn:hover { filter: brightness(0.96); }
    @keyframes card-fall { 0%,100% { transform: translateY(0) rotate(-8deg); } 50% { transform: translateY(10px) rotate(-4deg); } }
    @keyframes slot-glow { 0%,100% { box-shadow: 0 0 0 0 rgba(244,162,97,0.5); } 50% { box-shadow: 0 0 0 14px rgba(244,162,97,0); } }
    .drag-card { animation: card-fall 1.6s ease-in-out infinite; }
    .empty-slot { animation: slot-glow 1.6s ease-in-out infinite; }
  </style>
<style>
  html, body { margin: 0; padding: 0; background: #EDEBF5; display:flex; align-items:center; justify-content:center; min-height:100vh; }
</style>
</head>
<body>
<div style="width:1024px;height:768px;box-sizing:border-box;position:relative;overflow:hidden;background:#FFF9F3;font-family:'Nunito',sans-serif;color:#2B2A4A;display:flex;flex-direction:column;">

  <div style="display:flex;align-items:center;justify-content:space-between;padding:20px 32px;">
    <a href="Main.html" class="back-btn" aria-label="Voltar ao in&iacute;cio" style="width:44px;height:44px;border-radius:50%;background:#FFFFFF;box-shadow:0 6px 14px rgba(43,42,74,0.10);display:flex;align-items:center;justify-content:center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F4A261" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:24px;">Rotina da Manh&atilde;</div>
    <div style="width:44px;height:44px;"></div>
  </div>
  <div style="text-align:center;font-family:'Nunito',sans-serif;font-weight:700;font-size:14px;color:#8A7A5E;">Arrasta os cart&otilde;es para a ordem certa</div>

  <div style="flex-grow:1;position:relative;">

    <!-- card being dragged -->
    <div class="drag-card" style="position:absolute;top:70px;left:770px;width:150px;background:#FFFFFF;border-radius:22px;padding:16px;box-shadow:0 18px 26px rgba(43,42,74,0.22);text-align:center;">
      <svg width="46" height="46" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="8" width="12" height="12" rx="3" fill="#4EA8DE"/><path d="M9 8V6a3 3 0 0 1 6 0v2" stroke="#2B2A4A" stroke-width="1.6" fill="none"/></svg>
      <div style="font-family:'Baloo 2',sans-serif;font-weight:700;font-size:14px;margin-top:6px;">Vestir</div>
    </div>

    <!-- timeline -->
    <div style="position:absolute;bottom:70px;left:60px;right:60px;display:flex;align-items:center;justify-content:center;gap:16px;">

      <div style="width:160px;background:#FFFFFF;border-radius:22px;padding:18px;box-shadow:0 8px 18px rgba(43,42,74,0.10);text-align:center;">
        <svg width="46" height="46" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="14" r="6" fill="#FFC145"/><line x1="2" y1="21" x2="22" y2="21" stroke="#F4A261" stroke-width="2.4" stroke-linecap="round"/><g stroke="#FFC145" stroke-width="2" stroke-linecap="round"><line x1="12" y1="4" x2="12" y2="1"/><line x1="4" y1="9" x2="1.5" y2="7"/><line x1="20" y1="9" x2="22.5" y2="7"/></g></svg>
        <div style="font-family:'Baloo 2',sans-serif;font-weight:700;font-size:14px;margin-top:6px;">Acordar</div>
      </div>

      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F4A261" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>

      <div style="width:160px;background:#FFFFFF;border-radius:22px;padding:18px;box-shadow:0 8px 18px rgba(43,42,74,0.10);text-align:center;">
        <svg width="46" height="46" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="14" height="5" rx="2.5" fill="#4EA8DE"/><rect x="16" y="7" width="5" height="11" rx="2.5" fill="#FF8FB1"/></svg>
        <div style="font-family:'Baloo 2',sans-serif;font-weight:700;font-size:14px;margin-top:6px;">Escovar Dentes</div>
      </div>

      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F4A261" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>

      <div style="width:160px;background:#FFFFFF;border-radius:22px;padding:18px;box-shadow:0 8px 18px rgba(43,42,74,0.10);text-align:center;">
        <svg width="46" height="46" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="#F4C7A0"/><path d="M9 9c1-1 5-1 6 0" stroke="#2B2A4A" stroke-width="1.2" fill="none"/></svg>
        <div style="font-family:'Baloo 2',sans-serif;font-weight:700;font-size:14px;margin-top:6px;">Lavar Cara</div>
      </div>

      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F4A261" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>

      <div class="empty-slot" style="width:160px;background:#FDEEDF;border:4px dashed #F4A261;border-radius:22px;padding:18px;text-align:center;">
        <span style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:28px;color:#F4A261;">?</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
