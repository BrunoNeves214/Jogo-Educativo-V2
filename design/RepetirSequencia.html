<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>25. Repetir sequência</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; }
    .back-btn:hover { filter: brightness(0.96); }
    @keyframes flash-glow { 0%,100% { box-shadow: 0 0 0 0 rgba(255,111,89,0.6), inset 0 0 0 0 rgba(255,255,255,0.3); filter: brightness(1); } 50% { box-shadow: 0 0 40px 10px rgba(255,111,89,0.55); filter: brightness(1.25); } }
    .lit-pad { animation: flash-glow 1.1s ease-in-out infinite; }
    .dim-pad { opacity: .45; }
  </style>
<style>
  html, body { margin: 0; padding: 0; background: #EDEBF5; display:flex; align-items:center; justify-content:center; min-height:100vh; }
</style>
</head>
<body>
<div style="width:1024px;height:768px;box-sizing:border-box;position:relative;overflow:hidden;background:#FAF7FF;font-family:'Nunito',sans-serif;color:#2B2A4A;display:flex;flex-direction:column;">

  <div style="display:flex;align-items:center;justify-content:space-between;padding:20px 32px;">
    <a href="Main.html" class="back-btn" aria-label="Voltar ao in&iacute;cio" style="width:44px;height:44px;border-radius:50%;background:#FFFFFF;box-shadow:0 6px 14px rgba(43,42,74,0.10);display:flex;align-items:center;justify-content:center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B892FF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:24px;">Repete a Sequ&ecirc;ncia</div>
    <div style="width:44px;height:44px;"></div>
  </div>

  <!-- pattern to repeat -->
  <div style="display:flex;justify-content:center;align-items:center;gap:16px;padding:10px 0 6px 0;">
    <div style="background:#FFFFFF;border-radius:20px;padding:14px 22px;display:flex;align-items:center;gap:14px;box-shadow:0 8px 18px rgba(43,42,74,0.10);">
      <svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="8" ry="3" fill="#FF6F59"/><path d="M4 6v10a8 3 0 0 0 16 0V6" fill="#FFC145" stroke="#FF6F59" stroke-width="1"/></svg>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C9C6DC" stroke-width="2.4" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      <svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="8" ry="3" fill="#FF6F59"/><path d="M4 6v10a8 3 0 0 0 16 0V6" fill="#FFC145" stroke="#FF6F59" stroke-width="1"/></svg>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C9C6DC" stroke-width="2.4" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      <svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0-6 6v3l-2 5h16l-2-5V9a6 6 0 0 0-6-6Z" fill="#FFC145"/></svg>
    </div>
  </div>
  <div style="text-align:center;font-family:'Nunito',sans-serif;font-weight:700;font-size:13px;color:#8A7FAE;">Repete tocando na mesma ordem</div>

  <div style="flex-grow:1;display:grid;grid-template-columns:repeat(2, 220px);grid-template-rows:repeat(2, 220px);gap:24px;justify-content:center;align-content:center;">

    <div class="lit-pad" style="width:220px;height:220px;border-radius:36px;background:#FF6F59;display:flex;align-items:center;justify-content:center;">
      <svg width="100" height="100" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="8" ry="3" fill="#FFFFFF"/><path d="M4 6v10a8 3 0 0 0 16 0V6" fill="#FFE7E1" stroke="#FFFFFF" stroke-width="1"/></svg>
    </div>

    <div class="dim-pad" style="width:220px;height:220px;border-radius:36px;background:#4EA8DE;display:flex;align-items:center;justify-content:center;">
      <div style="display:flex;gap:6px;">
        <div style="width:14px;height:80px;border-radius:7px;background:#FFFFFF;"></div>
        <div style="width:14px;height:60px;border-radius:7px;background:#FFFFFF;align-self:flex-end;"></div>
        <div style="width:14px;height:70px;border-radius:7px;background:#FFFFFF;align-self:flex-end;"></div>
      </div>
    </div>

    <div class="dim-pad" style="width:220px;height:220px;border-radius:36px;background:#FFC145;display:flex;align-items:center;justify-content:center;">
      <svg width="90" height="90" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0-6 6v3l-2 5h16l-2-5V9a6 6 0 0 0-6-6Z" fill="#FFFFFF"/></svg>
    </div>

    <div class="dim-pad" style="width:220px;height:220px;border-radius:36px;background:#6BBF59;display:flex;align-items:center;justify-content:center;gap:12px;">
      <svg width="40" height="70" viewBox="0 0 24 40" aria-hidden="true"><circle cx="12" cy="10" r="9" fill="#FFFFFF"/><rect x="9" y="18" width="6" height="20" rx="3" fill="#F0EAD6"/></svg>
      <svg width="40" height="70" viewBox="0 0 24 40" aria-hidden="true"><circle cx="12" cy="10" r="9" fill="#FFFFFF"/><rect x="9" y="18" width="6" height="20" rx="3" fill="#F0EAD6"/></svg>
    </div>
  </div>
</div>
</body>
</html>
