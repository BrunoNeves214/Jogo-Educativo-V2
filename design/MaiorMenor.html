<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>17. Maior ou menor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; }
    .back-btn:hover { filter: brightness(0.96); }
    @keyframes throb { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    @keyframes float-balloon { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
    .throb { animation: throb 1.4s ease-in-out infinite; }
    .float1 { animation: float-balloon 3s ease-in-out infinite; }
    .float2 { animation: float-balloon 3.4s ease-in-out infinite .4s; }
  </style>
<style>
  html, body { margin: 0; padding: 0; background: #EDEBF5; display:flex; align-items:center; justify-content:center; min-height:100vh; }
</style>
</head>
<body>
<div style="width:1024px;height:768px;box-sizing:border-box;position:relative;overflow:hidden;background:#F5FBF2;font-family:'Nunito',sans-serif;color:#2B2A4A;display:flex;flex-direction:column;">

  <div style="display:flex;align-items:center;justify-content:space-between;padding:20px 32px;">
    <a href="Main.html" class="back-btn" aria-label="Voltar ao in&iacute;cio" style="width:44px;height:44px;border-radius:50%;background:#FFFFFF;box-shadow:0 6px 14px rgba(43,42,74,0.10);display:flex;align-items:center;justify-content:center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6BBF59" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:24px;">Toca no MAIOR</div>
    <div style="width:44px;height:44px;"></div>
  </div>

  <div style="flex-grow:1;display:flex;align-items:center;justify-content:center;gap:90px;">

    <div class="float1" style="position:relative;">
      <div class="throb" style="width:220px;height:260px;border-radius:50% 50% 50% 50% / 55% 55% 45% 45%;background:#FF6F59;box-shadow:0 16px 30px rgba(255,111,89,0.35), inset -14px -14px 0 rgba(0,0,0,0.06);"></div>
      <div style="width:4px;height:60px;background:#B9977C;margin:0 auto;"></div>
      <div style="position:absolute;top:-18px;left:50%;transform:translateX(-50%);width:44px;height:44px;">
        <svg viewBox="0 0 24 24" fill="#FFC145" aria-hidden="true"><path d="M3 8l4 3 5-6 5 6 4-3-2 11H5Z"/></svg>
      </div>
    </div>

    <div class="float2" style="position:relative;opacity:.85;">
      <div style="width:100px;height:118px;border-radius:50% 50% 50% 50% / 55% 55% 45% 45%;background:#4EA8DE;box-shadow:0 10px 18px rgba(43,42,74,0.16), inset -8px -8px 0 rgba(0,0,0,0.06);"></div>
      <div style="width:3px;height:40px;background:#B9977C;margin:0 auto;"></div>
    </div>
  </div>
</div>
</body>
</html>
