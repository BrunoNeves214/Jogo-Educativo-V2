<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>13. Aponta para o objeto</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; }
    .back-btn:hover { filter: brightness(0.96); }
    @keyframes pop { 0% { transform: scale(0.6); opacity: 0; } 60% { transform: scale(1.15); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
    .burst-star { animation: pop .6s ease-out infinite alternate; }
  </style>
<style>
  html, body { margin: 0; padding: 0; background: #EDEBF5; display:flex; align-items:center; justify-content:center; min-height:100vh; }
</style>
</head>
<body>
<div style="width:1024px;height:768px;box-sizing:border-box;position:relative;overflow:hidden;background:#F2FAFF;font-family:'Nunito',sans-serif;color:#2B2A4A;display:flex;flex-direction:column;">

  <div style="display:flex;align-items:center;justify-content:space-between;padding:20px 32px;">
    <a href="Main.html" class="back-btn" aria-label="Voltar ao in&iacute;cio" style="width:44px;height:44px;border-radius:50%;background:#FFFFFF;box-shadow:0 6px 14px rgba(43,42,74,0.10);display:flex;align-items:center;justify-content:center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4EA8DE" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div style="background:#FFFFFF;border-radius:999px;padding:10px 22px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 16px rgba(43,42,74,0.12);">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4EA8DE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M17 8.5a5 5 0 0 1 0 7"/></svg>
      <span style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:19px;">Onde est&aacute; o C&Atilde;O?</span>
    </div>
    <div style="width:44px;height:44px;"></div>
  </div>

  <div style="flex-grow:1;display:grid;grid-template-columns:repeat(2, 220px);grid-template-rows:repeat(2, 220px);gap:26px;justify-content:center;align-content:center;">

    <div style="position:relative;width:220px;height:220px;border-radius:34px;background:#FFFFFF;box-shadow:0 12px 26px rgba(63,182,95,0.35);border:5px solid #3FB65F;display:flex;align-items:center;justify-content:center;">
      <svg width="120" height="120" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6c-1.5 0-2.5 2-1.5 4l2 2" fill="none" stroke="#8B5E34" stroke-width="1.6" stroke-linecap="round"/><path d="M19 6c1.5 0 2.5 2 1.5 4l-2 2" fill="none" stroke="#8B5E34" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="12" r="6.5" fill="#C68B59"/><circle cx="9.5" cy="11.5" r="1.1" fill="#2B2A4A"/><circle cx="14.5" cy="11.5" r="1.1" fill="#2B2A4A"/><ellipse cx="12" cy="14" rx="1.4" ry="1" fill="#2B2A4A"/></svg>
      <svg class="burst-star" width="30" height="30" viewBox="0 0 24 24" fill="#FFC145" style="position:absolute;top:-6px;right:14px;" aria-hidden="true"><path d="M12 2l3 6 6.5.9-4.7 4.6 1.1 6.5L12 17l-5.9 3 1.1-6.5L2.5 8.9 9 8Z"/></svg>
      <svg class="burst-star" width="22" height="22" viewBox="0 0 24 24" fill="#FF8FB1" style="position:absolute;bottom:6px;left:6px;animation-delay:.3s;" aria-hidden="true"><path d="M12 2l3 6 6.5.9-4.7 4.6 1.1 6.5L12 17l-5.9 3 1.1-6.5L2.5 8.9 9 8Z"/></svg>
    </div>

    <div style="width:220px;height:220px;border-radius:34px;background:#FFFFFF;box-shadow:0 8px 18px rgba(43,42,74,0.10);display:flex;align-items:center;justify-content:center;">
      <svg width="110" height="110" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4l2.5 4h7L18 4l-1 5a6 6 0 0 1-10 0Z" fill="#F4A261"/><circle cx="9.3" cy="12.5" r="1.1" fill="#2B2A4A"/><circle cx="14.7" cy="12.5" r="1.1" fill="#2B2A4A"/></svg>
    </div>

    <div style="width:220px;height:220px;border-radius:34px;background:#FFFFFF;box-shadow:0 8px 18px rgba(43,42,74,0.10);display:flex;align-items:center;justify-content:center;">
      <svg width="100" height="100" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#FF6F59"/><path d="M4 12h16M12 4v16" stroke="#FFFFFF" stroke-width="1.4"/></svg>
    </div>

    <div style="width:220px;height:220px;border-radius:34px;background:#FFFFFF;box-shadow:0 8px 18px rgba(43,42,74,0.10);display:flex;align-items:center;justify-content:center;">
      <svg width="100" height="100" viewBox="0 0 24 24" aria-hidden="true"><rect x="10.5" y="14" width="3" height="9" rx="1" fill="#8B5E34"/><circle cx="12" cy="9" r="8" fill="#6BBF59"/></svg>
    </div>
  </div>
</div>
</body>
</html>
