<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5. Combinar por cor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; }
    .back-btn:hover { filter: brightness(0.96); }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes glow-pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(46,196,182,0.45); } 50% { box-shadow: 0 0 0 14px rgba(46,196,182,0); } }
    @keyframes shake { 0%,100% { transform: rotate(0deg) translateX(0); } 20% { transform: rotate(-7deg) translateX(-4px); } 40% { transform: rotate(6deg) translateX(3px); } 60% { transform: rotate(-5deg) translateX(-3px); } 80% { transform: rotate(4deg) translateX(2px); } }
    .ball1 { animation: bob 2.6s ease-in-out infinite; }
    .ball2 { animation: bob 2.6s ease-in-out infinite .3s; }
    .ball3 { animation: bob 2.6s ease-in-out infinite .6s; }
    .target-basket { animation: glow-pulse 1.6s ease-in-out infinite; }
    .refuse-basket { animation: shake 1.4s ease-in-out infinite; }
  </style>
<style>
  html, body { margin: 0; padding: 0; background: #EDEBF5; display:flex; align-items:center; justify-content:center; min-height:100vh; }
</style>
</head>
<body>
<div style="width:1024px;height:768px;box-sizing:border-box;position:relative;overflow:hidden;background:#EFFBFA;font-family:'Nunito',sans-serif;color:#2B2A4A;display:flex;flex-direction:column;">

  <div style="display:flex;align-items:center;justify-content:space-between;padding:20px 32px;">
    <a href="Main.html" class="back-btn" aria-label="Voltar ao in&iacute;cio" style="width:44px;height:44px;border-radius:50%;background:#FFFFFF;box-shadow:0 6px 14px rgba(43,42,74,0.10);display:flex;align-items:center;justify-content:center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2EC4B6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:24px;">Combinar por Cor</div>
    <div style="width:44px;height:44px;"></div>
  </div>

  <div style="flex-grow:1;position:relative;padding:10px 60px 30px 60px;">

    <!-- tray -->
    <div style="display:flex;gap:60px;justify-content:center;padding-top:16px;">
      <div class="ball1" style="width:76px;height:76px;border-radius:50%;background:#4EA8DE;box-shadow:0 10px 16px rgba(43,42,74,0.16), inset -6px -6px 0 rgba(0,0,0,0.08);"></div>
      <div class="ball2" style="width:76px;height:76px;border-radius:50%;background:#FFC145;box-shadow:0 10px 16px rgba(43,42,74,0.16), inset -6px -6px 0 rgba(0,0,0,0.08);"></div>
      <div class="ball3" style="width:76px;height:76px;border-radius:50%;background:#6BBF59;box-shadow:0 10px 16px rgba(43,42,74,0.16), inset -6px -6px 0 rgba(0,0,0,0.08);"></div>
    </div>

    <!-- ball mid-drag toward its basket -->
    <div style="position:absolute;top:170px;left:120px;width:76px;height:76px;border-radius:50%;background:#FF6F59;box-shadow:0 18px 26px rgba(43,42,74,0.26), inset -6px -6px 0 rgba(0,0,0,0.08);z-index:3;"></div>

    <!-- purple ball being refused near the wrong basket -->
    <div style="position:absolute;top:300px;left:454px;width:60px;height:60px;border-radius:50%;background:#B892FF;box-shadow:0 10px 16px rgba(43,42,74,0.2), inset -5px -5px 0 rgba(0,0,0,0.08);z-index:3;"></div>

    <!-- baskets -->
    <div style="position:absolute;bottom:20px;left:60px;right:60px;display:flex;gap:24px;justify-content:center;">
      <div class="target-basket" style="width:170px;height:100px;border-radius:0 0 32px 32px;background:#FFE7E1;border:5px solid #FF6F59;border-top:none;"></div>
      <div class="refuse-basket" style="width:170px;height:100px;border-radius:0 0 32px 32px;background:#E3F2FB;border:5px solid #4EA8DE;border-top:none;"></div>
      <div style="width:170px;height:100px;border-radius:0 0 32px 32px;background:#FFF3D9;border:5px solid #FFC145;border-top:none;"></div>
      <div style="width:170px;height:100px;border-radius:0 0 32px 32px;background:#E8F6E4;border:5px solid #6BBF59;border-top:none;"></div>
    </div>
  </div>
</div>
</body>
</html>
