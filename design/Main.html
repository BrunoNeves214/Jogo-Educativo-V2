<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Início</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; }
    .cat-card { transition: transform .15s ease, box-shadow .15s ease; }
    .cat-card:hover { transform: translateY(-4px); box-shadow: 0 16px 28px rgba(43,42,74,0.18); }
    .icon-btn:hover { filter: brightness(0.94); }
  </style>
<style>
  html, body { margin: 0; padding: 0; background: #EDEBF5; display:flex; align-items:center; justify-content:center; min-height:100vh; }
</style>
</head>
<body>
<div style="width:1024px;height:768px;box-sizing:border-box;position:relative;overflow:hidden;background:#EAF6FF;font-family:'Nunito',sans-serif;color:#2B2A4A;display:flex;flex-direction:column;">

  <!-- decorative sky -->
  <div style="position:absolute;top:36px;left:56px;width:150px;height:64px;background:#FFFFFF;border-radius:40px;opacity:.85;"></div>
  <div style="position:absolute;top:84px;right:130px;width:104px;height:48px;background:#FFFFFF;border-radius:32px;opacity:.7;"></div>
  <div style="position:absolute;top:150px;left:340px;width:80px;height:38px;background:#FFFFFF;border-radius:26px;opacity:.6;"></div>

        <circle cx="39" cy="30" r="2.6" fill="#2B2A4A"/>
        <path d="M24 37 Q32 43 40 37" stroke="#2B2A4A" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      </svg>
      <span style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:26px;">Aprende Brincando</span>
    </div>
    <div style="display:flex;align-items:center;gap:12px;">
      <div style="width:52px;height:52px;border-radius:50%;background:#4EA8DE;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:22px;color:#FFFFFF;box-shadow:0 6px 14px rgba(43,42,74,0.18);">S</div>

    <h1 style="margin:0;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:36px;">Ol&aacute;, Sofia!</h1>
    <p style="margin:6px 0 0 0;font-family:'Nunito',sans-serif;font-weight:700;font-size:16px;color:#6B6A8A;">Escolhe um jogo para come&ccedil;ar a aprender!</p>
  </div>

    <a href="Category.html" class="cat-card" style="display:flex;flex-direction:column;gap:8px;background:#FFFFFF;border-radius:26px;padding:16px;box-shadow:0 8px 18px rgba(43,42,74,0.10);border:3px solid #FFE7E1;">
      <div style="width:56px;height:56px;border-radius:16px;background:#FF6F59;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:20px;color:#FFFFFF;">Aa</div>
      <div style="font-family:'Baloo 2',sans-serif;font-weight:700;font-size:17px;">Letras e N&uacute;meros</div>
      <div style="font-family:'Nunito',sans-serif;font-weight:600;font-size:12px;color:#8A89A6;">4 jogos</div>
    </a>

    <button type="button" class="cat-card" style="text-align:left;display:flex;flex-direction:column;gap:8px;background:#FFFFFF;border:3px solid #DFF7F4;border-radius:26px;padding:16px;box-shadow:0 8px 18px rgba(43,42,74,0.10);">

      </div>
      <div style="font-family:'Baloo 2',sans-serif;font-weight:700;font-size:17px;">Cores e Formas</div>
      <div style="font-family:'Nunito',sans-serif;font-weight:600;font-size:12px;color:#8A89A6;">3 jogos</div>
    </button>

    <button type="button" class="cat-card" style="text-align:left;display:flex;flex-direction:column;gap:8px;background:#FFFFFF;border:3px solid #FFF3D9;border-radius:26px;padding:16px;box-shadow:0 8px 18px rgba(43,42,74,0.10);">
      <div style="width:56px;height:56px;border-radius:16px;background:#FFB627;display:flex;align-items:center;justify-content:center;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><ellipse cx="12" cy="16.5" rx="6" ry="4.6"/><ellipse cx="4.6" cy="9.4" rx="2.1" ry="2.9"/><ellipse cx="9.6" cy="5.6" rx="2.1" ry="2.9"/><ellipse cx="14.4" cy="5.6" rx="2.1" ry="2.9"/><ellipse cx="19.4" cy="9.4" rx="2.1" ry="2.9"/></svg>
      </div>
      <div style="font-family:'Baloo 2',sans-serif;font-weight:700;font-size:17px;">Animais e Sons</div>
      <div style="font-family:'Nunito',sans-serif;font-weight:600;font-size:12px;color:#8A89A6;">3 jogos</div>
    </button>

    <button type="button" class="cat-card" style="text-align:left;display:flex;flex-direction:column;gap:8px;background:#FFFFFF;border:3px solid #EDE9F8;border-radius:26px;padding:16px;box-shadow:0 8px 18px rgba(43,42,74,0.10);">
      <div style="width:56px;height:56px;border-radius:16px;background:#8E7DBE;display:flex;align-items:center;justify-content:center;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M4 4h6a2 2 0 1 1 4 0h6v6a2 2 0 1 0 0 4v6h-6a2 2 0 1 1-4 0H4v-6a2 2 0 1 0 0-4Z"/></svg>
      </div>
      <div style="font-family:'Baloo 2',sans-serif;font-weight:700;font-size:17px;">L&oacute;gica e Mem&oacute;ria</div>
      <div style="font-family:'Nunito',sans-serif;font-weight:600;font-size:12px;color:#8A89A6;">2 jogos</div>
    </button>

    <button type="button" class="cat-card" style="text-align:left;display:flex;flex-direction:column;gap:8px;background:#FFFFFF;border:3px solid #E3F2FB;border-radius:26px;padding:16px;box-shadow:0 8px 18px rgba(43,42,74,0.10);">
      <div style="width:56px;height:56px;border-radius:16px;background:#4EA8DE;display:flex;align-items:center;justify-content:center;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-4 4v-4H4Z"/><line x1="7" y1="9" x2="17" y2="9"/><line x1="7" y1="12.5" x2="14" y2="12.5"/></svg>
      </div>
      <div style="font-family:'Baloo 2',sans-serif;font-weight:700;font-size:17px;">Vocabul&aacute;rio</div>
      <div style="font-family:'Nunito',sans-serif;font-weight:600;font-size:12px;color:#8A89A6;">3 jogos</div>
    </button>

    <button type="button" class="cat-card" style="text-align:left;display:flex;flex-direction:column;gap:8px;background:#FFFFFF;border:3px solid #E8F6E4;border-radius:26px;padding:16px;box-shadow:0 8px 18px rgba(43,42,74,0.10);">
      <div style="width:56px;height:56px;border-radius:16px;background:#6BBF59;display:flex;align-items:center;justify-content:center;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><rect x="10" y="3" width="4" height="18" rx="1.4"/><rect x="3" y="10" width="18" height="4" rx="1.4"/></svg>
      </div>
      <div style="font-family:'Baloo 2',sans-serif;font-weight:700;font-size:17px;">Matem&aacute;tica</div>
      <div style="font-family:'Nunito',sans-serif;font-weight:600;font-size:12px;color:#8A89A6;">3 jogos</div>
    </button>

    <button type="button" class="cat-card" style="text-align:left;display:flex;flex-direction:column;gap:8px;background:#FFFFFF;border:3px solid #FFEAF1;border-radius:26px;padding:16px;box-shadow:0 8px 18px rgba(43,42,74,0.10);">
      <div style="width:56px;height:56px;border-radius:16px;background:#FF8FB1;display:flex;align-items:center;justify-content:center;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1-5L16 4l4 4L9 19l-5 1Z"/><line x1="14" y1="6" x2="18" y2="10"/></svg>
      </div>
      <div style="font-family:'Baloo 2',sans-serif;font-weight:700;font-size:17px;">Motricidade Fina</div>
      <div style="font-family:'Nunito',sans-serif;font-weight:600;font-size:12px;color:#8A89A6;">3 jogos</div>
    </button>

    <button type="button" class="cat-card" style="text-align:left;display:flex;flex-direction:column;gap:8px;background:#FFFFFF;border:3px solid #FDEEDF;border-radius:26px;padding:16px;box-shadow:0 8px 18px rgba(43,42,74,0.10);">
      <div style="width:56px;height:56px;border-radius:16px;background:#F4A261;display:flex;align-items:center;justify-content:center;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 9l2 2 4-4"/><line x1="8" y1="16" x2="16" y2="16"/></svg>

      <div style="font-family:'Nunito',sans-serif;font-weight:600;font-size:12px;color:#8A89A6;">2 jogos</div>
    </button>

    <button type="button" class="cat-card" style="text-align:left;display:flex;flex-direction:column;gap:8px;background:#FFFFFF;border:3px solid #F1E9FF;border-radius:26px;padding:16px;box-shadow:0 8px 18px rgba(43,42,74,0.10);">
      <div style="width:56px;height:56px;border-radius:16px;background:#B892FF;display:flex;align-items:center;justify-content:center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M9 17a3 3 0 1 1-2-2.83V4.5a1 1 0 0 1 1.2-.98l8 1.6A1 1 0 0 1 17 6.1v8.4a3 3 0 1 1-2-2.83V8.1l-6-1.2Z"/></svg>
      </div>
      <div style="font-family:'Baloo 2',sans-serif;font-weight:700;font-size:17px;">M&uacute;sica e Ritmo</div>
      <div style="font-family:'Nunito',sans-serif;font-weight:600;font-size:12px;color:#8A89A6;">2 jogos</div>
    </button>

  </div>
</div>
